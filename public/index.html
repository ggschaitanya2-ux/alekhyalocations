<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alekhya Locations</title>
<meta name="theme-color" content="#0f1115">
<style>
:root{
  --bg:#0f1115;--panel:#171a21;--panel2:#1e222b;--line:#2a2f3a;--text:#e7e9ee;--mute:#8b93a3;
  --amber:#f59e0b;--amber2:#fbbf24;--red:#ef4444;--green:#10b981;--blue:#3b82f6;
  --r:10px;--conn:#3b4252;--font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px/1.45 var(--font)}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--amber)}
label{display:block;font-size:12px;color:var(--mute);margin:10px 0 4px}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:#3a4150}
.btn.pri{background:var(--amber);border-color:var(--amber);color:#111;font-weight:600}
.btn.pri:hover{background:var(--amber2)}
.btn.danger{color:var(--red);border-color:#4b2525}
.btn.sm{padding:4px 8px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.hide{display:none!important}
.mute{color:var(--mute)}
header{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:5}
header .logo{width:28px;height:28px;border-radius:7px;background:var(--amber);color:#111;display:grid;place-items:center;font-weight:800}
header h1{font-size:15px;margin:0;font-weight:650}
header .sp{flex:1}
.chip{font-size:11px;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--mute)}
main{display:grid;grid-template-columns:minmax(300px,420px) 1fr;height:calc(100vh - 53px)}
#treePane{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.tools{padding:10px;display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.tools input{flex:1;min-width:140px}
#tree{overflow:auto;flex:1;padding:6px 0 40px}
.node{display:flex;align-items:center;gap:6px;padding:5px 10px;cursor:pointer;border-left:3px solid transparent;user-select:none}
.node:hover{background:var(--panel2)}
.node.sel{background:#2a2412;border-left-color:var(--amber)}
.node.off{opacity:.45}
.node .tw{width:16px;text-align:center;color:var(--mute);flex:none}
.node .dot{width:8px;height:8px;border-radius:50%;flex:none}
.node .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.node .cd{font-size:11px;color:var(--mute)}
.node .ct{margin-left:auto;font-size:11px;color:var(--mute)}
#detail{overflow:auto;padding:18px 22px 60px;min-height:0}
.crumb{font-size:12px;color:var(--mute);margin-bottom:6px}
.crumb a{color:var(--mute);text-decoration:none;cursor:pointer}.crumb a:hover{color:var(--amber)}
.dtitle{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.dtitle h2{margin:0;font-size:20px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-top:14px}
.card h3{margin:0 0 6px;font-size:13px;color:var(--mute);font-weight:600;text-transform:uppercase;letter-spacing:.04em;display:flex;align-items:center;gap:8px}
.card h3 .sp{flex:1}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:0 12px}
.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.kids{width:100%;border-collapse:collapse}
.kids td{padding:6px 4px;border-top:1px solid var(--line)}
.kids tr:hover td{background:var(--panel2)}
.kids .nm{cursor:pointer}
.tag{font-size:11px;padding:1px 7px;border-radius:99px;color:#fff;display:inline-block}
.empty{display:grid;place-items:center;height:70%;color:var(--mute);text-align:center}
.meta-row{display:grid;grid-template-columns:1fr 1.4fr auto;gap:6px;margin-top:6px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#222833;border:1px solid var(--line);padding:10px 16px;border-radius:9px;z-index:50;max-width:90vw}
.toast.err{border-color:var(--red);color:#fecaca}
dialog{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:14px;padding:0;width:min(640px,94vw);max-height:90vh}
dialog::backdrop{background:#000a}
dialog .dh{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center}
dialog .dh b{flex:1}
dialog .db{padding:4px 18px 16px;overflow:auto;max-height:calc(90vh - 120px)}
dialog .df{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
.lvl{border:1px dashed var(--line);border-radius:10px;padding:4px 12px 12px;margin-top:10px}
.lvl .grid{grid-template-columns:1.2fr .6fr .6fr 1.3fr 1fr}
.preview{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;font:12px/1.5 ui-monospace,Menlo,monospace;max-height:220px;overflow:auto;white-space:pre}
.hint{font-size:12px;color:var(--mute);margin-top:6px}
#login{display:grid;place-items:center;min-height:100vh;padding:16px}
#login form{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:26px;width:min(360px,100%)}
#login h1{margin:8px 0 2px;font-size:20px}
.back{display:none}
@media (max-width:820px){
  main{grid-template-columns:1fr}
  #detail{position:fixed;inset:53px 0 0 0;background:var(--bg);z-index:4;padding:14px 16px 60px;display:none}
  body.showDetail #detail{display:block}
  .back{display:inline-block}
  .lvl .grid{grid-template-columns:1fr 1fr}
}

/* ---------- chart view (org-chart like the site sketch) ---------- */
.viewtog{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.viewtog button{background:none;border:0;padding:6px 12px;cursor:pointer;color:var(--mute)}
.viewtog button.on{background:var(--amber);color:#111;font-weight:600}
#chartPane{display:none;flex-direction:column;min-height:0;min-width:0;border-right:1px solid var(--line)}
body.chart #treePane{display:none}
body.chart #chartPane{display:flex}
body.chart main{grid-template-columns:minmax(0,1fr) minmax(320px,400px)}
.ctools{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid var(--line)}
.sitechip{background:var(--panel2);border:1px solid var(--line);border-radius:99px;padding:5px 12px;cursor:pointer}
.sitechip.on{border-color:var(--amber);color:var(--amber2)}
#chartWrap{flex:1;overflow:auto;padding:24px 16px 80px}
.oc{display:inline-block;min-width:100%;text-align:center}
.oc ul{display:flex;justify-content:center;margin:0;padding:22px 0 0;position:relative}
.oc>ul{padding-top:0}
.oc li{list-style:none;position:relative;padding:22px 5px 0;display:flex;flex-direction:column;align-items:center}
.oc li::before,.oc li::after{content:'';position:absolute;top:0;right:50%;width:50%;height:22px;border-top:2px solid var(--conn)}
.oc li::after{right:auto;left:50%;border-left:2px solid var(--conn)}
.oc li:only-child::before,.oc li:only-child::after{display:none}
.oc li:only-child{padding-top:0}
.oc li:first-child::before,.oc li:last-child::after{border:0 none}
.oc li:last-child::before{border-right:2px solid var(--conn);border-radius:0 8px 0 0}
.oc li:first-child::after{border-radius:8px 0 0 0}
.oc ul ul::before{content:'';position:absolute;top:0;left:50%;border-left:2px solid var(--conn);height:22px}
.oc>ul>li{padding-top:0}.oc>ul>li::before,.oc>ul>li::after{display:none}
.cn{background:var(--panel);border:1.5px solid var(--line);border-radius:10px;min-width:96px;max-width:170px;padding:7px 10px 6px;text-align:left;cursor:pointer;position:relative;transition:border-color .12s, box-shadow .12s}
.cn:hover{border-color:#3a4150}
.cn.sel{border-color:var(--amber);box-shadow:0 0 0 3px #f59e0b33}
.cn.off{opacity:.45}
.cn.root{min-width:200px;padding:10px 14px}
.cn.root .cnm{font-size:16px}
.cn .ct{font-size:10px;text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.cn .cnm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cn .ccd{font-size:11px;color:var(--mute)}
.cn .cf{display:flex;align-items:center;gap:4px;margin-top:5px}
.cn .cf .sp{flex:1}
.cbtn{white-space:nowrap;border:1px solid var(--line);background:var(--panel2);border-radius:99px;font-size:11px;padding:1px 8px;cursor:pointer;color:var(--mute);line-height:18px}
.cbtn:hover{color:var(--text);border-color:#3a4150}
.cbtn.add{color:var(--amber2);border-color:#5a4514;font-weight:700;padding:0 8px;font-size:15px}
.cn[draggable=true]{cursor:grab}
.cn.dragging{opacity:.35}
.cn.drop-in{border-color:var(--amber);box-shadow:0 0 0 3px #f59e0b55;background:#2a2412}
.cn.drop-before{box-shadow:-6px 0 0 -1px var(--amber)}
.cn.drop-after{box-shadow:6px 0 0 -1px var(--amber)}
.cn input.ren{width:100%;padding:3px 6px;font-weight:600}
.addcard{background:var(--panel);border:1.5px dashed var(--amber);border-radius:10px;padding:8px;width:190px;text-align:left}
.addcard input,.addcard select{padding:5px 7px;font-size:13px;margin-top:5px}
.addcard .row{display:flex;gap:5px}
.addcard .hint{margin-top:5px;font-size:11px}
.chelp{font-size:12px;color:var(--mute)}
@media (max-width:820px){ body.chart main{grid-template-columns:minmax(0,1fr)} .chelp{display:none} }
</style>
</head>
<body>

<div id="login" class="hide">
  <form onsubmit="doLogin(event)">
    <div class="logo" style="width:40px;height:40px;border-radius:10px;background:var(--amber);color:#111;display:grid;place-items:center;font-weight:800;font-size:18px">L</div>
    <h1>Alekhya Locations</h1>
    <div class="mute">Sign in with your Alekhya Gate login</div>
    <label>Username</label><input id="lu" autocomplete="username" required>
    <label>Password</label><input id="lp" type="password" autocomplete="current-password" required>
    <button class="btn pri" style="width:100%;margin-top:16px">Sign in</button>
    <div id="lerr" class="hint" style="color:var(--red)"></div>
  </form>
</div>

<div id="app" class="hide">
  <header>
    <div class="logo">L</div><h1>Alekhya Locations</h1>
    <div class="viewtog"><button id="vChart" onclick="setView('chart')">Chart</button><button id="vList" onclick="setView('list')">List</button></div>
    <span class="sp"></span>
    <span id="roleChip" class="chip"></span>
    <button class="btn sm editOnly" onclick="openImport()">Import / Export</button>
    <button class="btn sm adminOnly" onclick="openTypes()">Types</button>
    <button class="btn sm editOnly" onclick="openAudit()">History</button>
    <button class="btn sm" onclick="logout()">Sign out</button>
  </header>
  <main>
    <section id="treePane">
      <div class="tools">
        <input id="q" placeholder="Search locations…" oninput="renderTree()">
        <button class="btn pri editOnly" onclick="openAdd(null)">+ Site</button>
        <div style="display:flex;align-items:center;gap:6px;font-size:12px;width:100%">
          <label style="display:flex;align-items:center;gap:6px;margin:0"><input type="checkbox" id="showOff" style="width:auto" onchange="load()"> Show inactive</label>
          <span style="flex:1"></span>
          <a class="mute" style="cursor:pointer" onclick="expandAll(true)">Expand all</a> ·
          <a class="mute" style="cursor:pointer" onclick="expandAll(false)">Collapse</a>
        </div>
      </div>
      <div id="tree"></div>
    </section>
    <section id="chartPane">
      <div class="ctools">
        <div id="siteChips" style="display:flex;gap:6px;flex-wrap:wrap"></div>
        <button class="btn sm pri editOnly" onclick="openAdd(null)">+ Site</button>
        <span style="flex:1"></span>
        <span class="chelp editOnly">Drag a box onto another to move it inside · drop on a box's left/right edge to reorder · double-click to rename</span>
        <button class="btn sm" onclick="chartLevels(1)">Towers</button>
        <button class="btn sm" onclick="chartLevels(2)">Floors</button>
        <button class="btn sm" onclick="chartLevels(9)">All</button>
        <button class="btn sm" onclick="zoom(-0.1)">−</button><button class="btn sm" onclick="zoom(0.1)">+</button>
      </div>
      <div id="chartWrap"><div class="oc" id="oc"></div></div>
    </section>
    <section id="detail"><div class="empty"><div>Select a location<br><span class="hint">or add a site to begin</span></div></div></section>
  </main>
</div>

<dialog id="dlg"><div class="dh"><b id="dlgT"></b><button class="btn sm" onclick="dlg.close()">✕</button></div><div class="db" id="dlgB"></div><div class="df" id="dlgF"></div></dialog>

<script>
'use strict';
const S = { token: null, user: null, types: [], flat: [], byId: new Map(), open: new Set(), sel: null, copen: new Set(), site: null, adding: null, drag: null, zoom: 1, view: 'chart' };
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store = { get(k){try{return localStorage.getItem(k)}catch{return null}}, set(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch{}} };

function toast(msg, err){ const t=document.createElement('div'); t.className='toast'+(err?' err':''); t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(), err?4500:2200); }

async function api(path, opts={}){
  const r = await fetch(path, { method: opts.method||'GET', headers: { 'Content-Type':'application/json', ...(S.token?{Authorization:'Bearer '+S.token}:{}) }, body: opts.body!==undefined ? JSON.stringify(opts.body) : undefined });
  if (r.status === 401 && path !== '/api/login') { logout(); throw new Error('Session expired — sign in again'); }
  const ct = r.headers.get('content-type')||'';
  const data = ct.includes('json') ? await r.json() : await r.text();
  if (!r.ok) throw new Error(data.error || 'Request failed');
  return data;
}
const run = fn => async (...a) => { try { return await fn(...a); } catch(e){ toast(e.message, true); } };

// ---------- auth ----------
async function doLogin(e){
  e.preventDefault(); $('lerr').textContent='';
  try {
    const r = await api('/api/login', { method:'POST', body:{ username:$('lu').value, password:$('lp').value } });
    S.token = r.token; store.set('alk_loc_token', r.token); await boot();
  } catch(err){ $('lerr').textContent = err.message; }
}
function logout(){ S.token=null; store.set('alk_loc_token', null); $('app').classList.add('hide'); $('login').classList.remove('hide'); }
async function boot(){
  S.token = S.token || store.get('alk_loc_token');
  if (!S.token) return logout();
  try { S.user = await api('/api/me'); } catch { return logout(); }
  $('login').classList.add('hide'); $('app').classList.remove('hide');
  $('roleChip').textContent = (S.user.full_name||S.user.username) + ' · ' + S.user.role + (S.user.can_edit?'':' (view only)');
  document.querySelectorAll('.editOnly').forEach(el=>el.classList.toggle('hide', !S.user.can_edit));
  document.querySelectorAll('.adminOnly').forEach(el=>el.classList.toggle('hide', !S.user.is_admin));
  try { S.open = new Set(JSON.parse(store.get('alk_loc_open')||'[]')); } catch {}
  try { const c = JSON.parse(store.get('alk_loc_copen')||'null'); if (c) S.copen = new Set(c); else S.copenFresh = true; } catch { S.copenFresh = true; }
  S.view = store.get('alk_loc_view') || 'chart'; S.zoom = +(store.get('alk_loc_zoom') || (innerWidth < 820 ? 0.8 : 1)) || 1;
  setView(S.view, true);
  await load();
}

// ---------- data ----------
const typeOf = c => S.types.find(t=>t.code===c) || { label:c, color:'#64748b' };
async function load(){
  const off = $('showOff').checked ? '&include_inactive=1' : '';
  const [types, flat] = await Promise.all([api('/api/types'), api('/api/locations?x=1'+off)]);
  S.types = types; S.flat = flat; S.byId = new Map(flat.map(n=>[n.id, {...n, kids:[]}]));
  for (const n of S.byId.values()) { const p = S.byId.get(n.parent_id); if (p) p.kids.push(n); }
  renderTree(); renderChart();
  if (S.sel && S.byId.has(S.sel)) renderDetail(S.sel); else if (S.sel) { S.sel=null; $('detail').innerHTML='<div class="empty">Select a location</div>'; }
}
const roots = () => [...S.byId.values()].filter(n=>!S.byId.has(n.parent_id));
function saveOpen(){ store.set('alk_loc_open', JSON.stringify([...S.open])); }
function expandAll(on){ S.open = on ? new Set([...S.byId.values()].filter(n=>n.kids.length).map(n=>n.id)) : new Set(); saveOpen(); renderTree(); }

function renderTree(){
  const q = $('q').value.trim().toLowerCase();
  const hit = q ? new Set(S.flat.filter(n=>n.path_name.toLowerCase().includes(q)).flatMap(n=>n.path_ids)) : null;
  const out = [];
  (function walk(list, depth){
    for (const n of list){
      if (hit && !hit.has(n.id)) continue;
      const open = hit ? true : S.open.has(n.id);
      const t = typeOf(n.type);
      out.push(`<div class="node${S.sel===n.id?' sel':''}${n.effective_active?'':' off'}" style="padding-left:${10+depth*16}px" onclick="pick(${n.id})">
        <span class="tw" onclick="event.stopPropagation();tog(${n.id})">${n.kids.length?(open?'▾':'▸'):''}</span>
        <span class="dot" style="background:${esc(t.color)}"></span>
        <span class="nm">${esc(n.name)}</span>${n.code?`<span class="cd">${esc(n.code)}</span>`:''}
        ${n.kids.length?`<span class="ct">${n.kids.length}</span>`:''}</div>`);
      if (open) walk(n.kids, depth+1);
    }
  })(roots(), 0);
  $('tree').innerHTML = out.join('') || `<div class="empty" style="height:auto;padding:40px 16px">${q?'No matches':'No locations yet.'+(S.user?.can_edit?'<br><br><button class="btn pri" onclick="openAdd(null)">+ Add first site</button>':'')}</div>`;
}
function tog(id){ S.open.has(id)?S.open.delete(id):S.open.add(id); saveOpen(); renderTree(); }
function pick(id){
  S.sel = id; const n = S.byId.get(id);
  n.path_ids.forEach(i=>S.open.add(i)); saveOpen();
  const r = n.path_ids[0];
  const visible = S.view === 'chart' && r === S.site && document.querySelector(`#oc .cn[data-id="${id}"]`);
  if (visible) { document.querySelectorAll('#oc .cn.sel').forEach(c=>c.classList.remove('sel')); visible.classList.add('sel'); }
  else { S.site = r; n.path_ids.slice(0,-1).forEach(i=>S.copen.add(i)); saveCopen(); renderChart(); }
  renderTree(); renderDetail(id); document.body.classList.add('showDetail');
}

// ---------- detail ----------
function renderDetail(id){
  const n = S.byId.get(id); if (!n) return;
  const ed = S.user.can_edit, t = typeOf(n.type);
  const crumbs = n.path_ids.slice(0,-1).map(i=>S.byId.get(i)).filter(Boolean).map(p=>`<a onclick="pick(${p.id})">${esc(p.name)}</a>`).join(' › ');
  const metaRows = Object.entries(n.meta||{});
  const kids = n.kids;
  $('detail').innerHTML = `
    <button class="btn sm back" onclick="document.body.classList.remove('showDetail')">← Tree</button>
    <div class="crumb">${crumbs||'&nbsp;'}</div>
    <div class="dtitle"><h2>${esc(n.name)}</h2><span class="tag" style="background:${esc(t.color)}">${esc(t.label)}</span>
      ${n.effective_active?'':'<span class="chip" style="color:var(--red);border-color:#4b2525">Inactive</span>'}
      <span class="chip">ID ${n.id}</span>${n.path_code?`<span class="chip">${esc(n.path_code)}</span>`:''}</div>

    <div class="card"><h3>Details</h3>
      <div class="grid">
        <div><label>Name</label><input id="f_name" value="${esc(n.name)}" ${ed?'':'disabled'}></div>
        <div><label>Code</label><input id="f_code" value="${esc(n.code)}" ${ed?'':'disabled'} placeholder="e.g. T1, 501"></div>
        <div><label>Type</label><select id="f_type" ${ed?'':'disabled'}>${S.types.filter(x=>x.active||x.code===n.type).map(x=>`<option value="${esc(x.code)}" ${x.code===n.type?'selected':''}>${esc(x.label)}</option>`).join('')}</select></div>
        <div><label>Sort order</label><input id="f_sort" type="number" value="${n.sort_order}" ${ed?'':'disabled'}></div>
      </div>
      <label>Extra fields <span class="mute">(area, facing, BHK…)</span></label>
      <div id="metaBox">${metaRows.map(([k,v])=>metaRow(k,v,ed)).join('')}</div>
      ${ed?`<button class="btn sm" style="margin-top:6px" onclick="$('metaBox').insertAdjacentHTML('beforeend', metaRow('','',true))">+ field</button>
      <div class="actions"><button class="btn pri" onclick="saveNode(${n.id})">Save changes</button></div>`:''}
    </div>

    <div class="card"><h3>Inside ${esc(n.name)} <span class="mute" style="text-transform:none">(${kids.length})</span><span class="sp"></span>
      ${ed?`<button class="btn sm" onclick="openAdd(${n.id})">+ Add one</button><button class="btn sm pri" onclick="openBulk(${n.id})">+ Bulk add</button>`:''}</h3>
      ${kids.length?`<table class="kids">${kids.map((k,i)=>`<tr>
        <td style="width:14px"><span class="dot" style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${esc(typeOf(k.type).color)}"></span></td>
        <td class="nm" onclick="pick(${k.id})" ${k.effective_active?'':'style="opacity:.45"'}>${esc(k.name)} ${k.code?`<span class="mute">· ${esc(k.code)}</span>`:''}</td>

function openBulk(parentId){

function readLvls(){ return [...document.querySelectorAll('#b_lvls .lvl')].map(d=>({ type:d.querySelector('.b_type').value, from:d.querySelector('.b_from').value, to:d.querySelector('.b_to').value, name:d.querySelector('.b_name').value, code:d.querySelector('.b_code').value, skip:d.querySelector('.b_skip').value })); }
function addLvl(){ const n=document.querySelectorAll('#b_lvls .lvl').length; if(n>=3) return toast('Max 3 levels', true); $('b_lvls').insertAdjacentHTML('beforeend', lvlHtml({type:'room',from:1,to:3,name:'Room {n}',code:''}, n)); $('dlgB').oninput(); }

    if (r.action==='duplicate') return `copied ${r.after?.count} locations`;

function setView(v, quiet){

function saveCopen(){ store.set('alk_loc_copen', JSON.stringify([...S.copen])); }

function chartLevels(depth){
  const site = S.byId.get(S.site); if (!site) return;
  S.copen = new Set([...S.copen].filter(id => !S.byId.get(id)?.path_ids.includes(site.id)));
  (function walk(n, d){ if (d < depth && n.kids.length) { S.copen.add(n.id); n.kids.forEach(k => walk(k, d+1)); } })(site, 0);
  saveCopen(); renderChart();
}
// Suggest the next name/code from the last sibling: Floor 7 → Floor 8, Flat 504 → Flat 505, Tower B → Tower C
function bumpLast(s){
  if (!s) return '';
  let m = s.match(/^(.*?)(\d+)(\D*)$/);
  if (m) { const n = String(+m[2] + 1).padStart(m[2].length, '0'); return m[1] + n + m[3]; }
  m = s.match(/^(.*?)([A-Y])$/);
  if (m) return m[1] + String.fromCharCode(m[2].charCodeAt(0) + 1);
  return '';
}
function suggestNext(parentId){
  const p = S.byId.get(parentId); const last = p?.kids[p.kids.length - 1];
  const type = guessChildType(parentId);
  if (last) return { type: last.type, name: bumpLast(last.name), code: bumpLast(last.code) };
  const num = (p?.code.match(/(\d+)\D*$/) || p?.name.match(/(\d+)\D*$/) || [])[1];
  const first = { block:['Tower A','TA'], floor:['Floor 1','F01'], flat:[num ? `Flat ${num}01` : 'Flat 101', num ? `${num}01` : '101'], room:['Living',''], plot:['Plot 1','P001'], area:['',''] }[type] || ['',''];
  return { type, name: first[0], code: first[1] };
}
function renderChart(){
  if (S.view !== 'chart' || !S.user) return;
  const sites = roots();
  if (!S.site || !S.byId.has(S.site)) S.site = sites[0]?.id ?? null;
  if (S.copenFresh && S.site) { S.copenFresh = false; chartLevels(1); return; }
  $('siteChips').innerHTML = sites.map(s => `<button class="sitechip${s.id===S.site?' on':''}" onclick="S.site=${s.id};renderChart()">${esc(s.name)}</button>`).join('');
  const site = S.byId.get(S.site);
  $('oc').style.zoom = S.zoom;
  if (!site) { $('oc').innerHTML = `<div class="empty" style="height:auto;padding:60px 0">No sites yet.${S.user.can_edit?'<br><br><button class="btn pri" onclick="openAdd(null)">+ Add first site</button>':''}</div>`; return; }
  const ed = S.user.can_edit;
  const card = (n, isRoot) => {
    const t = typeOf(n.type), open = S.copen.has(n.id), nk = n.kids.length;
    const same = nk && n.kids.every(k => k.type === n.kids[0].type);
    const kidLabel = !nk ? '' : same ? `${nk} ${esc((typeOf(n.kids[0].type).label.split(' /')[0]).toLowerCase())}${nk>1?'s':''}` : `${nk} inside`;
    return `<div class="cn${isRoot?' root':''}${S.sel===n.id?' sel':''}${n.effective_active?'':' off'}" data-id="${n.id}" ${ed && !isRoot?'draggable="true"':''}
        onclick="pick(${n.id})" ondblclick="event.stopPropagation();renameInline(${n.id})">
      <div class="ct" style="color:${esc(t.color)}">${esc(t.label.split(' /')[0])}</div>
      <div class="cnm" title="${esc(n.path_name)}">${esc(n.name)}</div>${n.code?`<div class="ccd">${esc(n.code)}</div>`:''}
      ${(nk || ed) ? `<div class="cf">${nk?`<button class="cbtn" onclick="event.stopPropagation();ctog(${n.id})">${open?'▾':'▸'} ${kidLabel}</button>`:''}<span class="sp"></span>
        ${ed?`<button class="cbtn add" title="Add inside ${esc(n.name)}" onclick="event.stopPropagation();startAdd(${n.id})">+</button>`:''}</div>`:''}
    </div>`;
  };
  const addCard = pid => {
    const sg = S.addDraft || suggestNext(pid);
    return `<li><div class="addcard" onclick="event.stopPropagation()">
      <select id="ac_type">${typeOpts(sg.type)}</select>
      <input id="ac_name" placeholder="Name" value="${esc(sg.name)}" onkeydown="acKey(event,${pid})">
      <div class="row"><input id="ac_code" placeholder="Code" value="${esc(sg.code)}" onkeydown="acKey(event,${pid})"><button class="btn sm pri" style="margin-top:5px" onclick="saveAdd(${pid})">Add</button></div>
      <div class="hint">Enter adds and keeps going · Esc to stop</div></div></li>`;
  };
  const walk = (n, isRoot) => {
    const showKids = S.copen.has(n.id) && n.kids.length;
    const adding = S.adding === n.id;
    const inner = (showKids ? n.kids.map(k => walk(k, false)).join('') : '') + (adding ? addCard(n.id) : '');
    return `<li>${card(n, isRoot)}${inner ? `<ul>${inner}</ul>` : ''}</li>`;
  };
  $('oc').innerHTML = `<ul>${walk(site, true)}</ul>`;
  if (ed) wireDrag();
  if (S.adding) { const i = $('ac_name'); if (i) { i.focus({ preventScroll: true }); i.select(); keepVisible(i.closest('.addcard')); } }
  else if (S.lastCentered !== S.site) { S.lastCentered = S.site; keepVisible(document.querySelector('#oc .cn.root'), true); }
  else if (S.sel) keepVisible(document.querySelector(`#oc .cn[data-id="${S.sel}"]`));
}
// Scroll the chart so a box is in view (centred horizontally when asked or when it's off-screen)
function keepVisible(el, center){
  if (!el) return;
  const w = $('chartWrap'), wr = w.getBoundingClientRect(), r = el.getBoundingClientRect();
  if (center || r.left < wr.left || r.right > wr.right) w.scrollLeft += (r.left + r.width/2) - (wr.left + wr.width/2);
  if (r.bottom > wr.bottom - 20) w.scrollTop += r.bottom - wr.bottom + 60;
}
function ctog(id){ S.copen.has(id) ? S.copen.delete(id) : S.copen.add(id); saveCopen(); renderChart(); }
function startAdd(pid){ S.adding = pid; S.addDraft = null; S.copen.add(pid); saveCopen(); renderChart(); }
function acKey(e, pid){ if (e.key === 'Enter') { e.preventDefault(); saveAdd(pid); } if (e.key === 'Escape') { S.adding = null; renderChart(); } }
const saveAdd = run(async pid => {
  const body = { parent_id: pid, type: $('ac_type').value, name: $('ac_name').value, code: $('ac_code').value };
  if (!body.name.trim()) return toast('Type a name first', true);
  await api('/api/locations', { method:'POST', body });
  S.addDraft = null; await load();          // keeps the add box open with the next name suggested
  toast('Added ' + body.name);
});
function renameInline(id){
  if (!S.user.can_edit) return;
  const el = document.querySelector(`.cn[data-id="${id}"] .cnm`); if (!el) return;
  const n = S.byId.get(id);
  el.innerHTML = `<input class="ren" value="${esc(n.name)}">`;
  const i = el.querySelector('input'); i.focus(); i.select();
  i.onclick = e => e.stopPropagation();
  let done = false;
  const finish = run(async save => {
    if (done) return; done = true;
    if (save && i.value.trim() && i.value.trim() !== n.name) { await api('/api/locations/'+id, { method:'PATCH', body:{ name: i.value } }); toast('Renamed'); await load(); }
    else renderChart();
  });
  i.onkeydown = e => { if (e.key === 'Enter') finish(true); if (e.key === 'Escape') finish(false); };
  i.onblur = () => finish(true);
}
function wireDrag(){
  document.querySelectorAll('#oc .cn').forEach(el => {
    const id = +el.dataset.id;
    el.addEventListener('dragstart', e => { S.drag = id; el.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; try { e.dataTransfer.setData('text/plain', String(id)); } catch {} });
    el.addEventListener('dragend', () => { S.drag = null; document.querySelectorAll('.cn').forEach(c => c.classList.remove('dragging','drop-in','drop-before','drop-after')); });
    el.addEventListener('dragover', e => {
      if (!S.drag || S.drag === id) return;
      const tgt = S.byId.get(id);
      if (tgt.path_ids.includes(S.drag)) return;           // can't drop inside itself
      e.preventDefault();
      const r = el.getBoundingClientRect(), x = (e.clientX - r.left) / r.width;
      const zone = el.classList.contains('root') ? 'in' : x < 0.25 ? 'before' : x > 0.75 ? 'after' : 'in';
      el.classList.toggle('drop-in', zone === 'in'); el.classList.toggle('drop-before', zone === 'before'); el.classList.toggle('drop-after', zone === 'after');
      el.dataset.zone = zone;
    });
    el.addEventListener('dragleave', () => el.classList.remove('drop-in','drop-before','drop-after'));
    el.addEventListener('drop', e => { e.preventDefault(); const d = S.drag; S.drag = null; if (d) dropOn(d, id, el.dataset.zone || 'in'); });
  });
}
const dropOn = run(async (dragId, targetId, zone) => {
  const drag = S.byId.get(dragId), tgt = S.byId.get(targetId);
  if (zone === 'in') {
    if (drag.parent_id === targetId) return;
    await api(`/api/locations/${dragId}/move`, { method:'POST', body:{ parent_id: targetId } });
    S.copen.add(targetId); saveCopen();
    toast(`Moved ${drag.name} into ${tgt.name}`);
  } else {
    const pid = tgt.parent_id;
    if (drag.parent_id !== pid) await api(`/api/locations/${dragId}/move`, { method:'POST', body:{ parent_id: pid } });
    const ids = S.byId.get(pid).kids.map(k => k.id).filter(x => x !== dragId);
    ids.splice(ids.indexOf(targetId) + (zone === 'after' ? 1 : 0), 0, dragId);
    await api('/api/locations/reorder', { method:'POST', body:{ ids } });
    toast(`Placed ${drag.name} ${zone} ${tgt.name}`);
  }
  await load();
});

boot();
</script>
</body>
